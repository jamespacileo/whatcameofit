name: thenwhat

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: thenwhat
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-thenwhat}
      POSTGRES_DB: thenwhat
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      # Local only: used by Alembic and the pipeline when run outside Compose. Never by
      # the test suite, which has its own server (`test-db`).
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thenwhat -d thenwhat"]
      interval: 2s
      timeout: 3s
      retries: 30

  # The test suite's own Postgres. Tests drop and recreate databases, and a drop under
  # load once brought the working database's server down, so tests never share its
  # server: this one holds nothing but test databases, keeps them in memory, and is
  # lost whenever its container goes. It is not started by `docker compose up`; `make
  # check` starts it (`docker compose up -d --wait test-db`).
  test-db:
    profiles: ["test"]
    image: ${TEST_POSTGRES_IMAGE:-postgres:16}
    environment:
      POSTGRES_USER: thenwhat
      POSTGRES_PASSWORD: thenwhat
      POSTGRES_DB: postgres
    # Nothing here is worth a disk write: no fsync, no full-page images, small buffers.
    command: >
      postgres -c fsync=off -c synchronous_commit=off -c full_page_writes=off
      -c shared_buffers=128MB -c max_connections=100 -c max_wal_size=256MB
    tmpfs:
      - /var/lib/postgresql/data:size=3g
    shm_size: 256m
    ports:
      - "127.0.0.1:${TEST_DB_PORT:-5434}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thenwhat -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

  pipeline:
    build: ./pipeline
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://thenwhat:${POSTGRES_PASSWORD:-thenwhat}@db:5432/thenwhat
      EXPORT_PATH: /export/export.json
      # MEASURE_DIR in .env names a folder on this machine. Inside the container the
      # measurements are written to /measure, which is that folder mounted, so they
      # outlive `docker compose run --rm`. Unset, measuring stays off and /measure is an
      # unused empty volume.
      MEASURE_DIR: ${MEASURE_DIR:+/measure}
    volumes:
      - ./data/seed:/seed:ro
      - export-data:/export
      - ${MEASURE_DIR:-measure-off}:/measure
    # Bring the schema up to date, load the seed claim if it is not there yet, write the
    # export for the site, then stay up for `docker compose run pipeline thenwhat ...`.
    # The marker says this start's export is written. The export file itself cannot say
    # so: the volume keeps the one an earlier image wrote, perhaps in an older shape.
    command: >
      sh -c "rm -f /tmp/export-ready
      && alembic upgrade head
      && thenwhat seed load /seed/*.json
      && thenwhat export
      && touch /tmp/export-ready
      && exec sleep infinity"
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/export-ready"]
      interval: 2s
      timeout: 3s
      retries: 5
      # Migrations and the export take as long as the database is large.
      start_period: 600s
    depends_on:
      db:
        condition: service_healthy

  site:
    build: ./site
    environment:
      EXPORT_FILE: /app/live/export.json
    volumes:
      - export-data:/app/live:ro
    ports:
      - "127.0.0.1:${SITE_PORT:-4321}:4321"
    # The site builds from the export when it starts, so it waits for this start's export.
    depends_on:
      pipeline:
        condition: service_healthy

volumes:
  db-data:
  export-data:
  measure-off:
