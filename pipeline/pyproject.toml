[project]
name = "thenwhat"
version = "0.1.0"
description = "Pipeline and CLI that track what happened to reported medical breakthroughs"
authors = [
    { name = "James Pacileo", email = "608868+jamespacileo@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.8",
    "pyarrow>=26.0.1",
    "pydantic>=2.14.3",
    "pydantic-ai-slim[anthropic,openai]>=2.67.0",
    "pydantic-settings>=2.16.2",
    "rich>=15.0.0",
    "sqlalchemy>=2",
    "tenacity>=9.2.1",
    "typer>=0.29.1",
    "zstandard>=0.25.0",
]

[project.scripts]
thenwhat = "thenwhat.cli:app"

[build-system]
requires = ["uv_build>=0.11.20,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Generated migrations carry long constraint expressions verbatim.
"migrations/versions/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "import-linter>=2.16",
    "jsonschema>=4.26.0",
    "pytest>=9.2.0",
    "respx>=0.23.1",
    "ruff>=0.17.4",
    "time-machine>=3.6.0",
    "ty>=0.0.101",
]

[tool.importlinter]
root_package = "thenwhat"

[[tool.importlinter.contracts]]
name = "How work runs knows nothing of the steps it runs"
type = "forbidden"
source_modules = ["thenwhat.work"]
forbidden_modules = [
    "thenwhat.backfill",
    "thenwhat.claims",
    "thenwhat.cli",
    "thenwhat.events",
    "thenwhat.export",
    "thenwhat.extract",
    "thenwhat.lookup",
    "thenwhat.outlets",
    "thenwhat.prepare",
    "thenwhat.readings",
    "thenwhat.resolve",
    "thenwhat.review",
    "thenwhat.seed",
    "thenwhat.statements",
    "thenwhat.store",
    "thenwhat.terms",
]
# What it imports directly is the rule. A source client it asks through may itself
# import what it likes.
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Status rules are pure: no database, network, clock or settings"
type = "forbidden"
source_modules = ["thenwhat.status"]
forbidden_modules = [
    "thenwhat.backfill",
    "thenwhat.claims",
    "thenwhat.cli",
    "thenwhat.config",
    "thenwhat.db",
    "thenwhat.decide",
    "thenwhat.events",
    "thenwhat.export",
    "thenwhat.extract",
    "thenwhat.llm",
    "thenwhat.lookup",
    "thenwhat.measure",
    "thenwhat.outlets",
    "thenwhat.prepare",
    "thenwhat.readings",
    "thenwhat.resolve",
    "thenwhat.review",
    "thenwhat.seed",
    "thenwhat.sources",
    "thenwhat.statements",
    "thenwhat.store",
    "thenwhat.terms",
    "thenwhat.work",
]
