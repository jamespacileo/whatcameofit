name: CI and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ASTRO_TELEMETRY_DISABLED: "1"

defaults:
  run:
    shell: bash

jobs:
  tests:
    name: ${{ matrix.suite.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite:
          - { name: Pipeline tests, target: check-pipeline, lockfile: site/pnpm-lock.yaml }
          - { name: Store tests, target: check-store, lockfile: store/ingest/pnpm-lock.yaml }
          - { name: Site build tests, target: check-site-build, lockfile: site/pnpm-lock.yaml }
    env:
      UV_LOCKED: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        if: matrix.suite.target == 'check-pipeline'
        with:
          version: "0.11.20"
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: site/package.json
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: ${{ matrix.suite.lockfile }}
      - name: Run suite
        env:
          TARGET: ${{ matrix.suite.target }}
        run: make "$TARGET"

  site:
    name: Site tests and release build
    runs-on: ubuntu-latest
    timeout-minutes: 12
    outputs:
      build_digest: ${{ steps.archive.outputs.digest }}
      build_artifact: ${{ steps.archive.outputs.name }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: site/package.json
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      # Drawn card images, kept by what decides their pixels (site/src/lib/card-image.ts).
      # A run on main keeps them where every pull request's preview can read them.
      - name: Restore drawn cards
        id: cards
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: site/.cache/cards
          key: site-cards-${{ hashFiles('site/data/published-export.json', 'site/src/lib/card*.ts', 'site/pnpm-lock.yaml') }}
          restore-keys: site-cards-
      - name: Look for kept dependencies
        id: deps
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: site/node_modules
          key: site-deps-${{ runner.os }}-node26-${{ hashFiles('site/pnpm-lock.yaml') }}
          lookup-only: true
      - name: Run site, extension and shell checks
        run: make site-test extension-test extension scripts-test
      - name: Save production extension package
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: whatcameofit-extension
          path: extension/dist/
          if-no-files-found: error
          retention-days: 14
      - name: Rehearse production build
        run: make deploy-ci-check
        env:
          BUILD_REVISION: ${{ github.sha }}
          SUGGEST_URL: ${{ vars.SUGGEST_URL }}
          CORRECTIONS_URL: ${{ vars.CORRECTIONS_URL }}
          CHROME_STORE_URL: ${{ vars.CHROME_STORE_URL }}
          SAFARI_STORE_URL: ${{ vars.SAFARI_STORE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
          DECISION_BACKEND: ${{ vars.DECISION_BACKEND }}
      - name: Archive the checked site
        id: archive
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          archive="$RUNNER_TEMP/production-site.tar.gz"
          tar -C site -cf - dist | gzip -1 > "$archive"
          digest=$(sha256sum "$archive")
          echo "digest=${digest%% *}" >> "$GITHUB_OUTPUT"
          echo "name=production-site-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - name: Save the checked site
        if: steps.archive.outcome == 'success'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ${{ steps.archive.outputs.name }}
          path: ${{ runner.temp }}/production-site.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
      - name: Keep dependencies
        if: steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: site/node_modules
          key: ${{ steps.deps.outputs.cache-primary-key }}
      - name: Drop cards no longer drawn
        if: steps.cards.outputs.cache-hit != 'true'
        run: find site/.cache/cards -type f -mmin +30 -delete
      - name: Keep drawn cards
        if: steps.cards.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: site/.cache/cards
          key: ${{ steps.cards.outputs.cache-primary-key }}

  check:
    name: Tests and build
    needs: [tests, site]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every suite to pass
        env:
          TESTS: ${{ needs.tests.result }}
          SITE: ${{ needs.site.result }}
        run: |
          printf 'Test suites: %s\nSite tests and release build: %s\n' "$TESTS" "$SITE"
          test "$TESTS" = success && test "$SITE" = success

  # A rehearsal of task 6.2 of `cloudflare-source-of-truth`: take the export from the truth
  # store, hold it to the schema and the checks a published snapshot passes, and report how
  # it compares with the committed snapshot. Off unless the repository variable
  # EXPORT_FROM_STORE is `true`. Nothing it writes is built or deployed: the committed
  # snapshot stays the site's source, and the deploy job does not wait for this one.
  store-export:
    name: Export from the store (rehearsal)
    if: vars.EXPORT_FROM_STORE == 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment: store-rehearsal
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      UV_LOCKED: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.11.20"
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: site/package.json
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - run: pnpm --dir store/ingest install --frozen-lockfile
      - run: pnpm --dir site install --frozen-lockfile
      - name: Take the export from the store and check it
        run: make store-export-rehearsal
        env:
          # A token that can only read the store's database and bucket.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_STORE_READ_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          STORE_D1: ${{ vars.STORE_D1 }}
          STORE_R2_BUCKET: ${{ vars.STORE_R2_BUCKET }}
          # The export's settings are read with the database's address, which an export
          # from the store never opens.
          DATABASE_URL: postgresql+psycopg://unused:unused@127.0.0.1:1/unused
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
          DECISION_BACKEND: ${{ vars.DECISION_BACKEND }}

  deploy:
    name: Deploy production
    needs: [check, site]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://whatcameofit.com
    concurrency:
      group: cloudflare-production
      cancel-in-progress: false
      queue: max
    env:
      BUILD_REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: site/package.json
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      - run: pnpm --dir site install --frozen-lockfile
      - name: Download the checked site from this run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.site.outputs.build_artifact }}
          path: ${{ runner.temp }}/checked-production-site
      - name: Verify and unpack the checked site
        env:
          BUILD_DIGEST: ${{ needs.site.outputs.build_digest }}
        run: |
          [[ "$BUILD_DIGEST" =~ ^[a-f0-9]{64}$ ]]
          archive="$RUNNER_TEMP/checked-production-site/production-site.tar.gz"
          printf '%s  %s\n' "$BUILD_DIGEST" "$archive" | sha256sum --check -
          tar --no-same-owner --no-same-permissions -xzf "$archive" -C site
      - name: Check this is still the latest main revision
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [ "$latest" = "$GITHUB_SHA" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping superseded revision $GITHUB_SHA"
          fi
      - name: Deploy reviewed public snapshot
        if: steps.current.outputs.deploy == 'true'
        run: |
          : "${CLOUDFLARE_API_TOKEN:?Set CLOUDFLARE_PRODUCTION_API_TOKEN in the production environment}"
          : "${CLOUDFLARE_ACCOUNT_ID:?Set the CLOUDFLARE_ACCOUNT_ID repository variable}"
          make deploy-ci
        env:
          DEPLOY_REUSE_BUILD: "1"
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PRODUCTION_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
          DECISION_BACKEND: ${{ vars.DECISION_BACKEND }}
      - name: Check live site
        if: steps.current.outputs.deploy == 'true'
        run: node site/scripts/smoke-live.mjs
