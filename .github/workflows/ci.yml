name: CI and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ASTRO_TELEMETRY_DISABLED: "1"
  CI_NODE_VERSION: "26.13.1"
  UV_PYTHON: "3.12.13"
  TEST_POSTGRES_IMAGE: postgres@sha256:dd2bf3ce2dc83a81674cf7f217fcfd8a5009a4b325dda5b843bfee82a06cff6f

defaults:
  run:
    shell: bash

jobs:
  previous-pass:
    name: Look for a tested tree
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 2
    continue-on-error: true
    permissions:
      actions: read
      contents: read
    outputs:
      key: ${{ steps.inputs.outputs.key }}
      run: ${{ steps.verify.outputs.run }}
    steps:
      - name: Fingerprint the checked inputs
        id: inputs
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SUGGEST_URL: ${{ vars.SUGGEST_URL }}
          CORRECTIONS_URL: ${{ vars.CORRECTIONS_URL }}
          CHROME_STORE_URL: ${{ vars.CHROME_STORE_URL }}
          SAFARI_STORE_URL: ${{ vars.SAFARI_STORE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
          DECISION_BACKEND: ${{ vars.DECISION_BACKEND }}
        run: |
          # Tests and builds may read today's date. Limit reuse to the same day.
          if [[ -z "${ImageVersion:-}" || -z "${ImageOS:-}" ]]; then exit 0; fi
          tree=$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$GITHUB_SHA" --jq .tree.sha)
          if [[ ! "$tree" =~ ^[0-9a-f]{40}$ ]]; then exit 0; fi
          day=$(date -u +%F)
          key=$(printf '%s\0' "$tree" "$day" "$ImageOS" "$ImageVersion" "$RUNNER_ARCH" \
            "$SUGGEST_URL" "$CORRECTIONS_URL" "$CHROME_STORE_URL" "$SAFARI_STORE_URL" \
            "$LLM_MODEL" "$CONTACT_EMAIL" "$DECISION_BACKEND" | sha256sum)
          echo "key=pr-pass-$PR_NUMBER-${key%% *}" >> "$GITHUB_OUTPUT"
      - name: Restore the prior run number
        id: restore
        if: steps.inputs.outputs.key != ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/thenwhat-ci-pass
          key: ${{ steps.inputs.outputs.key }}
      - name: Verify the prior workflow passed
        id: verify
        if: steps.restore.outputs.cache-hit == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD: ${{ github.event.pull_request.head.ref }}
        run: |
          previous=$(cat "$RUNNER_TEMP/thenwhat-ci-pass")
          if [[ ! "$previous" =~ ^[0-9]+$ || "$previous" = "$GITHUB_RUN_ID" ]]; then exit 0; fi
          if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$previous" |
            jq -e --arg repo "$GITHUB_REPOSITORY" --arg branch "$PR_HEAD" '
              .event == "pull_request" and .status == "completed" and .conclusion == "success"
              and .head_repository.full_name == $repo and .head_branch == $branch
              and .path == ".github/workflows/ci.yml"
            ' > /dev/null; then
            echo "run=$previous" >> "$GITHUB_OUTPUT"
          fi

  tests:
    name: ${{ matrix.suite.name }}
    needs: previous-pass
    if: ${{ !cancelled() && needs.previous-pass.outputs.run == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite:
          - { name: Pipeline tests 1, targets: 'lint types test-fast', python: true, python_shard: '1/2' }
          - { name: Pipeline tests 2, targets: test-fast, python: true, python_shard: '2/2' }
          - { name: Pipeline round trip, targets: test-slow, python: true, lockfile: site/pnpm-lock.yaml }
          - { name: Store tests, targets: check-store, lockfile: store/ingest/pnpm-lock.yaml }
          - { name: Site build tests 1, targets: site-build-test, lockfile: site/pnpm-lock.yaml, shard: '1/3' }
          - { name: Site build tests 2 and browser search, targets: site-build-test, lockfile: site/pnpm-lock.yaml, shard: '2/3', browser_search: true }
          - { name: Site build tests 3, targets: site-build-test, lockfile: site/pnpm-lock.yaml, shard: '3/3' }
          - { name: 'Site, extension and shell tests', targets: 'site-test site-build check-extension scripts-test', lockfile: site/pnpm-lock.yaml }
    env:
      UV_LOCKED: "1"
      SITE_TEST_SHARD: ${{ matrix.suite.shard }}
      THENWHAT_PYTEST_SHARD: ${{ matrix.suite.python_shard }}
      STORE_TEST_CONCURRENCY: "3"
      # Padded so that one target name never matches inside another.
      TARGETS: ' ${{ matrix.suite.targets }} '
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Start fetching the test database image
        if: matrix.suite.python == true
        run: docker pull --quiet "$TEST_POSTGRES_IMAGE" > "$RUNNER_TEMP/test-db-pull.log" 2>&1 &
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        if: matrix.suite.python == true
        with:
          version: "0.11.20"
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        if: matrix.suite.lockfile != ''
        with:
          package_json_file: site/package.json
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: matrix.suite.lockfile != ''
        with:
          node-version: ${{ env.CI_NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: ${{ matrix.suite.lockfile }}
      # One step per make target, so GitHub's records time each one
      # (scripts/ci-timing.mjs). A suite runs its targets in this order.
      - name: make lint
        if: contains(env.TARGETS, ' lint ')
        run: make lint
      - name: make types
        if: contains(env.TARGETS, ' types ')
        run: make types
      - name: make test-fast
        if: contains(env.TARGETS, ' test-fast ')
        run: make test-fast
      - name: make test-slow
        if: contains(env.TARGETS, ' test-slow ')
        run: make test-slow
      - name: make check-store
        if: contains(env.TARGETS, ' check-store ')
        run: make check-store
      - name: make site-build-test
        if: contains(env.TARGETS, ' site-build-test ')
        run: make site-build-test
      - name: make site-test
        if: contains(env.TARGETS, ' site-test ')
        run: make site-test
      - name: make site-build
        if: contains(env.TARGETS, ' site-build ')
        run: make site-build
      - name: make check-extension
        if: contains(env.TARGETS, ' check-extension ')
        run: make check-extension
      - name: make scripts-test
        if: contains(env.TARGETS, ' scripts-test ')
        run: make scripts-test
      - name: Run site browser tests in Chromium
        if: matrix.suite.browser_search == true
        run: |
          pnpm --dir site exec playwright install --with-deps --only-shell chromium
          make site-search-test
      - name: Save production extension package
        if: contains(env.TARGETS, ' check-extension ')
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: whatcameofit-extension
          path: extension/dist/
          if-no-files-found: error
          retention-days: 14

  site:
    name: Production build rehearsal
    needs: previous-pass
    if: ${{ !cancelled() && needs.previous-pass.outputs.run == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: site/package.json
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.CI_NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      # Drawn card images, kept by what decides their pixels (site/src/lib/card-image.ts).
      # A run on main keeps them where every pull request's preview can read them.
      - name: Restore drawn cards
        id: cards
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: site/.cache/cards
          key: site-cards-${{ hashFiles('site/tests/bundle/manifest.json', 'site/src/lib/card*.ts', 'site/pnpm-lock.yaml') }}
          restore-keys: site-cards-
      - name: Look for kept dependencies
        id: deps
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: site/node_modules
          key: site-deps-${{ runner.os }}-node26-${{ hashFiles('site/pnpm-lock.yaml') }}
          lookup-only: true
      - name: Rehearse production build
        run: make deploy-ci-check
        env:
          SUGGEST_URL: ${{ vars.SUGGEST_URL }}
          CORRECTIONS_URL: ${{ vars.CORRECTIONS_URL }}
          CHROME_STORE_URL: ${{ vars.CHROME_STORE_URL }}
          SAFARI_STORE_URL: ${{ vars.SAFARI_STORE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
          DECISION_BACKEND: ${{ vars.DECISION_BACKEND }}
      - name: Keep dependencies
        if: steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: site/node_modules
          key: ${{ steps.deps.outputs.cache-primary-key }}
      - name: Drop cards no longer drawn
        if: steps.cards.outputs.cache-hit != 'true'
        run: find site/.cache/cards -type f -mmin +30 -delete
      - name: Keep drawn cards
        if: steps.cards.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: site/.cache/cards
          key: ${{ steps.cards.outputs.cache-primary-key }}

  check:
    name: Tests and build
    needs: [previous-pass, tests, site]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every suite to pass
        env:
          TESTS: ${{ needs.tests.result }}
          SITE: ${{ needs.site.result }}
          PRIOR_RUN: ${{ needs.previous-pass.outputs.run }}
        run: |
          if [[ "$PRIOR_RUN" =~ ^[0-9]+$ && "$TESTS" = skipped && "$SITE" = skipped ]]; then
            echo "Reused [run $PRIOR_RUN]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$PRIOR_RUN) for identical PR inputs." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          printf 'Test suites: %s\nProduction build rehearsal: %s\n' "$TESTS" "$SITE"
          test "$TESTS" = success && test "$SITE" = success
      - name: Record the successful full run
        if: needs.previous-pass.outputs.key != '' && needs.previous-pass.outputs.run == '' && needs.tests.result == 'success' && needs.site.result == 'success'
        run: printf '%s\n' "$GITHUB_RUN_ID" > "$RUNNER_TEMP/thenwhat-ci-pass"
      - name: Save the successful full run
        if: needs.previous-pass.outputs.key != '' && needs.previous-pass.outputs.run == '' && needs.tests.result == 'success' && needs.site.result == 'success'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/thenwhat-ci-pass
          key: ${{ needs.previous-pass.outputs.key }}
