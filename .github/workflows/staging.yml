name: Staging

# main's work on staging.whatcameofit.com (docs/deploy.md, "Staging"). Runs after CI and deploy
# has passed on a push to main, or when the operator starts it by hand on main, and never for a
# pull request: there is no pull_request or pull_request_target trigger, and
# site/tests/staging-workflow.test.mjs fails if one appears. The token lives in the `staging`
# environment, which releases it to main only. Nothing here runs a pull request's code.
on:
  workflow_run:
    workflows: ["CI and deploy"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging
  cancel-in-progress: false

env:
  ASTRO_TELEMETRY_DISABLED: "1"
  CI_NODE_VERSION: "26.13.1"

defaults:
  run:
    shell: bash

jobs:
  off:
    name: Staging is not switched on
    if: vars.STAGING_ENABLED != 'on'
    runs-on: ubuntu-latest
    steps:
      - run: echo "::notice::Staging is off. Set the repository variable STAGING_ENABLED to on once the staging environment holds CLOUDFLARE_STAGING_API_TOKEN and STAGING_PAIRS_DATABASE_ID (docs/deploy.md, Staging). Nothing was deployed."

  publish:
    name: Publish staging
    # A green CI run of a push to main, or a run started by hand on main.
    if: >-
      vars.STAGING_ENABLED == 'on' &&
      github.repository == 'jamespacileo/whatcameofit' &&
      ((github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository) ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: staging
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: site/package.json
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.CI_NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      - name: See that staging is set up
        id: ready
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_STAGING_API_TOKEN }}
          DATABASE_ID: ${{ vars.STAGING_PAIRS_DATABASE_ID }}
        run: |
          missing=()
          [ -n "$TOKEN" ] || missing+=("the secret CLOUDFLARE_STAGING_API_TOKEN")
          [ -n "$DATABASE_ID" ] || missing+=("the variable STAGING_PAIRS_DATABASE_ID")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::notice::Staging was skipped: the staging environment has no $(IFS=,; echo "${missing[*]}" | sed 's/,/ and no /g'). Nothing was deployed."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Build, publish and check staging
        if: steps.ready.outputs.ready == 'true'
        run: make deploy-staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_STAGING_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          STAGING_PAIRS_DATABASE_ID: ${{ vars.STAGING_PAIRS_DATABASE_ID }}
          STAGING_URL: ${{ vars.STAGING_URL || 'https://staging.whatcameofit.com' }}
          BUILD_REVISION: ${{ github.event.workflow_run.head_sha || github.sha }}
          SUGGEST_URL: ${{ vars.SUGGEST_URL }}
          CORRECTIONS_URL: ${{ vars.CORRECTIONS_URL }}
          CHROME_STORE_URL: ${{ vars.CHROME_STORE_URL }}
          SAFARI_STORE_URL: ${{ vars.SAFARI_STORE_URL }}
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
